# Turtle WoW General System Changes - Complete Data
# Diese Änderungen betreffen ALLE Klassen

general_system_changes:
  # ========================================
  # PATCH 1.16.0 - NEUE STATS
  # ========================================
  patch_1_16_0_new_stats:
    meditation_stat:
      description: "Neue Stat die Mana-Regeneration im Kampf ermöglicht"
      base_effect: "5% der Mana-Regeneration außerhalb des Kampfes"
      stacking: "Stackt additiv mit diminishing returns"
      spirit_scaling: "Dieser Effekt skaliert mit Spirit"
      examples:
        green_dragon_mail:
          per_piece: "5% Meditation"
          three_piece_bonus: "30% total (5% + 5% + 5% mit DR)"
      typical_values:
        generic_items: "1-3% Meditation"
        special_items: "5% Meditation"
        set_bonuses: "10-30% Meditation total"
      calculation:
        formula: "Mana_Regen_In_Combat = Base_Regen * (Meditation% / 100) * Spirit_Modifier"
        spirit_modifier: "Spirit erhöht die Effektivität"
        stack_with_talents: "Stackt mit Priest/Druid Meditation Talenten"
      
    haste_stat:
      description: "Neue Stat die Angriffsgeschwindigkeit erhöht"
      base_effect: "Fester Prozentsatz Geschwindigkeitserhöhung"
      stacking: "Stackt mit diminishing returns"
      typical_values:
        generic_items: "1-2% Haste"
        special_items: "bis zu 5% Haste"
      calculation:
        formula: "Attack_Speed = Base_Speed * (1 + Haste% / 100)"
        diminishing_returns: "Jeder weitere Haste-Punkt ist weniger effektiv"
      affects:
        melee_attacks: "Ja"
        ranged_attacks: "Ja"
        spell_casting: "Nein (in 1.16.0)"
        global_cooldown: "Nein"
      
    stat_priority_changes:
      caster_classes:
        new_priority: "Meditation wird wichtiger als Mp5 für lange Kämpfe"
        spirit_value: "Spirit wird wertvoller durch Meditation scaling"
      physical_classes:
        new_priority: "Haste wird wichtiger als reiner AP/Crit"
        attack_speed: "Kann mehr wert sein als Weapon DPS upgrades"
      
    pawn_implementation:
      meditation:
        base_value: "2.0"  # Ähnlich wie Mp5
        spirit_synergy: "Spirit value * 1.3 wenn Meditation vorhanden"
        calculation: "Meditation * Spirit_Modifier"
      haste:
        melee_value: "1.2"  # Zwischen Crit und Hit
        ranged_value: "1.1"  # Etwas weniger für Hunter
        diminishing_factor: "0.95 per point over 10%"

